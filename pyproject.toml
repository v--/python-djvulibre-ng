[project]
name = "djvulibre-ng"
description = "Modernized bindings for DjVuLibre"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

classifiers = [
  "Private :: Do Not Upload",
]

[build-system]
# uv build complains if no upper bound is set, but it updates its minor versions often, so we put a major version just to shut it up
requires = ["uv_build (>=0.10, <1)"]
build-backend = "uv_build"

[dependency-groups]
lint = [
  "ruff (>=0.16)",
  "ruff-config-ivasilev @ git+https://github.com/v--/ruff-config-ivasilev.git@v0.16.post1",
]

# typing = [
#   { include-group = "test" },
#   "mypy (>=2)",
# ]

test = [
  "pytest (>=9.0.3)",
]

dev = [
  "poethepoet (>=0.45)",
  "tox (>=4.50)",

  { include-group = "lint" },
  # { include-group = "typing" },
  { include-group = "test" },
]

# uv
[tool.uv]
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "djvulibre"
source-include = ["REUSE.toml"]

# ruff
[tool.ruff]
extend = ".venv/share/ruff/ruff.ivasilev.toml"
preview = true

[tool.ruff.lint]
ignore = [
  "D1", # undocumented-*
]

# mypy
[tool.mypy]
packages = ["djvulibre"]

[[tool.mypy.overrides]]
module = [
  "mesonbuild.*",
]
ignore_missing_imports = true

[tool.pytest]
# This is needed for testing with meson-python
#   See https://github.com/mesonbuild/meson-python/issues/642
addopts = ["--import-mode", "importlib"]
pythonpath = ["src"]
