[project]
name = "djvulibre-ng"
description = "Modernized bindings for DjVuLibre"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

classifiers = [
  "Private :: Do Not Upload",
]

[build-system]
requires = ["hatchling (>=1.15)"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
  "ruff (>=0.16)",
  "ruff-config-ivasilev @ git+https://github.com/v--/ruff-config-ivasilev.git@v0.16.post1",
]

typing = [
  { include-group = "test" },
  "mypy (>=2)",
]

test = [
  "pytest (>=9.0.3)",
]

docs = [
  "markdown-exec (>=1.12)",
  "mkdocstrings-python (>=2)",
  "zensical (>=0.1.0)",
]

dev = [
  "poethepoet (>=0.45)",
  "tox (>=4.50)",

  { include-group = "lint" },
  { include-group = "typing" },
  { include-group = "docs" },
  { include-group = "test" },
]

# uv
[tool.uv]
resolution = "lowest-direct"

# hatch
[tool.hatch.build.targets.sdist]
include = [
  "src/**/*.py",
  "src/**/py.typed",
  "src/djvulibre/bin/*",
  "docs/**/*.md",
  "LICENSES/*.txt",
  "CHANGELOG.md",
  "README.md",
  "REUSE.toml",
  "zensical.toml",
  "pyproject.toml",
  "poe_tasks.toml",
]

[tool.hatch.build.targets.wheel]
include = [
  "src/djvulibre/**/*.py",
  "src/djvulibre/bin/*",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/helpers/hatch_build.py"

# These options are helpful for debugging library loading errors
[tool.pytest]
log_level = "DEBUG"
addopts = ['--continue-on-collection-errors']

# ruff
[tool.ruff]
extend = ".venv/share/ruff/ruff.ivasilev.toml"
preview = true

[tool.ruff.lint]
ignore = [
  "D1", # undocumented-*
]

# mypy
[tool.mypy]
packages = ["djvulibre", "helpers"]

[[tool.mypy.overrides]]
module = [
  "hatchling.*",
]
ignore_missing_imports = true
