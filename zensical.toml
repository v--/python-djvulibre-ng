[project]
site_name = "python-djvulibre-ng"
site_description = "FFI-based bindings for DjVuLibre"
site_author = "Ianis Vasilev"
site_dir = "dist/docs"
site_url = "https://python-djvulibre-ng.readthedocs.io/"
repo_url = "https://github.com/v--/python-djvulibre-ng"
repo_name = "v--/python-djvulibre-ng"
watch = ["README.md"]
nav = [
  { "Index" = "index.md" },
  { "API Reference" = [
    { "FFI" = [
      { "djvulibre.ffi" = "api/ffi/index.md" },
      { "djvulibre.ffi.libdjvulibre" = "api/ffi/libdjvulibre.md" },
      { "djvulibre.ffi.miniexp" = "api/ffi/miniexp.md" },
    ] },
  ] },
]

# mkdocstrings
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
backlinks = "tree"
docstring_section_style = "list"
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
unwrap_annotated = true
relative_crossrefs = true

[project.plugins.markdown-exec]

[project.theme]
# Zensical requires an explicit list of "theme features".
# A default configuration can be found at
#   https://github.com/zensical/zensical/blob/master/python/zensical/bootstrap/zensical.toml
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Copied from
#   https://zensical.org/docs/setup/colors#automatic-light-dark-mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
