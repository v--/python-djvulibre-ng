name: Test

on:
  push:
    branches:
      - 'master'

  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: 3.14
          - os: macos-14
            python: 3.14
          - os: windows-2025
            python: 3.14

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Install prerequisites on Ubuntu
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install --yes libdjvulibre21

    - name: Install prerequisites on macOS
      if: startsWith(matrix.os, 'macos')
      run: brew install djvulibre

    # TODO: Figure out dynamic linking on Windows

    # - name: Init fixture repository
    #   run: |
    #     git submodule init
    #     git submodule update

    - name: Setup uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python }}
        activate-environment: true

    - name: Install the build and test dependencies
      run: uv sync --frozen --group test --no-default-groups --no-install-project

    - name: Install the package
      run: uv sync

    - name: Run tests
      run: uv run pytest
